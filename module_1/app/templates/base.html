<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nav.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
    <script src="{{ url_for('static', filename='js/nav.js') }}" defer></script>
</head>
<body>
    <nav class="navbar">
        <a class="nav-link {% if request.endpoint == 'main.index' %}active{% endif %}"
           href="{{ url_for('main.index') }}">Home</a>
        <a class="nav-link {% if request.endpoint == 'main.contact' %}active{% endif %}"
           href="{{ url_for('main.contact') }}">Contact</a>
        <a class="nav-link {% if request.endpoint == 'main.projects' %}active{% endif %}"
           href="{{ url_for('main.projects') }}">Projects</a>
        <a class="nav-link {% if request.endpoint == 'main.publications' %}active{% endif %}"
           href="{{ url_for('main.publications') }}">Publications</a>
    </nav>

    <main>
        {% block content %}
        Hello
        {% endblock %}
    </main>
</body>
</html>
