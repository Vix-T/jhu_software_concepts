name: Module 5 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pylint:
    # Pinned rather than ubuntu-latest, so a runner-image migration can't change the environment unannounced.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # GitHub only runs workflows from the repository root; module_5/.github/workflows/ci.yml
      # is a copy kept for the expected module layout, and must stay identical.
      - name: Check the module_5 workflow copy matches
        run: cmp .github/workflows/ci.yml module_5/.github/workflows/ci.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_5/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r module_5/requirements.txt

      - name: Run Pylint
        run: cd module_5 && python -m pylint src --fail-under=10

  dependency-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_5/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r module_5/requirements.txt

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      # The same command as the README's "Dependency graph" section.
      - name: Generate dependency.svg
        working-directory: module_5
        run: pydeps src/flask_app.py --noshow -T svg -o dependency.svg --max-module-depth 1 --rankdir TB --only applicant_search busy_state config flask_app load_data models orm_queries pull_data query_data scrape sql_utils flask psycopg2 sqlalchemy dotenv selenium bs4

      # A filter mistake still yields a valid but empty SVG, so count the nodes too.
      - name: Check dependency.svg has nodes
        working-directory: module_5
        run: |
          test -s dependency.svg
          nodes=$(grep -c 'class="node"' dependency.svg || true)
          echo "dependency.svg: $nodes nodes"
          test "$nodes" -gt 0

      - name: Upload dependency.svg
        uses: actions/upload-artifact@v7
        with:
          name: dependency-graph
          path: module_5/dependency.svg

  snyk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_VERSION: "1.1307.4"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check the SNYK_TOKEN secret is set
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::Repository secret SNYK_TOKEN is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_5/requirements.txt

      # Snyk ignores the os_name == 'nt' markers on these two lock entries and
      # stops with "Missing required packages" unless they are installed.
      - name: Install dependencies
        run: |
          python -m pip install -r module_5/requirements.txt
          python -m pip install cffi==2.1.1 pycparser==3.0

      - name: Install the Snyk CLI (pinned, checksum verified)
        run: |
          curl -fsSL -o snyk-linux "https://downloads.snyk.io/cli/v${SNYK_VERSION}/snyk-linux"
          curl -fsSL -o snyk-linux.sha256 "https://downloads.snyk.io/cli/v${SNYK_VERSION}/snyk-linux.sha256"
          sha256sum -c snyk-linux.sha256
          sudo install -m 0755 snyk-linux /usr/local/bin/snyk
          snyk --version

      - name: Snyk Open Source (fails on high or critical)
        working-directory: module_5
        run: snyk test --file=requirements.txt --package-manager=pip --command=python --severity-threshold=high

      # Report-only: the 11 findings are documented false positives (module_5/SNYK_FINDINGS.md).
      - name: Snyk Code (report only)
        working-directory: module_5
        continue-on-error: true
        run: snyk code test src

  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          # The name must end in "_test": module_5/tests/conftest.py refuses any other database.
          POSTGRES_DB: jhu_module5_test
          POSTGRES_USER: postgres
          # Trust auth inside the throwaway service container, so no password exists anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Job steps wait until the container reports healthy.
        options: >-
          --health-cmd "pg_isready -U postgres -d jhu_module5_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_5/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r module_5/requirements.txt

      # The README's repository-root command. Every test carries one of these markers,
      # so this runs the entire suite, and pytest.ini enforces --cov-fail-under=100.
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/jhu_module5_test
        run: python -m pytest -c module_5/pytest.ini -m "web or buttons or analysis or db or integration" module_5/tests
