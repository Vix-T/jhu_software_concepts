name: Module 6 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pylint:
    # Pinned rather than ubuntu-latest, so a runner-image migration can't change the environment unannounced.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The services run on python:3.11-slim, so lint and test on 3.11 too.
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: module_6/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r module_6/requirements.txt

      # One run over all three import roots (web, worker, db), as in the README.
      - name: Run Pylint
        working-directory: module_6
        run: python -m pylint --py-version=3.11 --source-roots=src/web,src/worker,src/db src/web src/worker src/db --fail-under=10

  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          # The name must end in "_test": module_6/tests/conftest.py refuses any other database.
          POSTGRES_DB: jhu_module6_test
          POSTGRES_USER: postgres
          # Trust auth inside the throwaway service container, so no password exists anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Job steps wait until the container reports healthy.
        options: >-
          --health-cmd "pg_isready -U postgres -d jhu_module6_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: module_6/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r module_6/requirements.txt

      # The README's repository-root command. Every test carries one of these markers,
      # so this runs the entire suite, and pytest.ini enforces --cov-fail-under=100.
      # RabbitMQ and Chrome are not needed: pika.BlockingConnection and the browser are faked.
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/jhu_module6_test
        run: python -m pytest -c module_6/pytest.ini -m "web or buttons or analysis or db or integration" module_6/tests

  compose-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Validates docker-compose.yml (syntax, interpolation defaults, anchors) without
      # pulling or building any image. Every ${VAR} has a default, so no .env is needed.
      - name: Validate docker-compose.yml
        run: docker compose -f module_6/docker-compose.yml config --quiet
