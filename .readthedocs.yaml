# Read the Docs configuration: builds the Module 4 Sphinx docs.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: module_4/docs/source/conf.py
  # Same standard as the local build (sphinx-build -W): warnings fail the build.
  fail_on_warning: true

python:
  install:
    # The app's own dependencies, so autodoc can import the modules it documents.
    - requirements: module_4/requirements.txt
    - requirements: module_4/docs/requirements.txt
